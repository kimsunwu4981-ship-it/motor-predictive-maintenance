  value_foot_table: 328
  value_flange_table: 175
  source: verify
  note: 발 장착(IM B3) 표의 AD 328 은 그림 B(90–200Fr) 끝면도에서 프레임 측면~단자함 끝까지의 전체 폭 치수로 그려져 있다(축 중심~단자함 상면이 아님). 플랜지(FF215) 표의 AD 175 는 플랜지 그림 기준으로 정의가 다르다. 두 값 모두 카탈로그 원문
    그대로 보관하고, 하우징 모델은 HD 247(단자함 상면 높이)만 구속으로 쓴다.
