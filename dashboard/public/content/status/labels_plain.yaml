# labels_plain.yaml — 상태 보드 단순 보기(3단 정보 구조)의 쉬운 말 사전 (2026-10-26).
# 전문 용어 ↔ 쉬운 말 ↔ 툴팁. 런타임에 읽는다(빌드 없이 새로고침). 숫자는 쓰지 않는다 — 임계값·정격은 export JSON 이 config 에서 가져온다.
# signals: 판정 신호(kind) 별 쉬운 이름. term 은 툴팁 첫 줄(정식 용어), tip 은 한 문장 설명.
signals:
  i2i1:             { plain: "전류 불균형",        term: "역상 전류비 I₂/I₁",            tip: "세 가닥 전류가 서로 얼마나 틀어졌는지 나타내는 비율. 권선 단락·전압 불평형에서 커집니다." }
  current_ratio:    { plain: "전류/정격",          term: "전류 비율 r = I / I정격",         tip: "지금 흐르는 전류를 그 모터의 정격 전류로 나눈 값. 너무 커도(과부하·단락) 너무 작아도(결상·무부하) 문제입니다." }
  phase_unbalance:  { plain: "상 불평형",          term: "상별 전류 편차(최대 |r−평균| / 평균)", tip: "세 상 전류가 평균에서 얼마나 벗어났는지. 표시용 보조값이며 판정에는 쓰지 않습니다." }
  temperature:      { plain: "온도",               term: "부품 온도 (열회로 모델)",          tip: "권선·베어링·로터·축의 추정 온도. 전기 모드에서는 계산하지 않습니다." }
  vibration:        { plain: "진동",               term: "진동 속도 RMS (mm/s)",            tip: "베어링 하우징의 진동 세기. ISO 규격의 경고·위험 경계를 씁니다." }
  bearing_kurtosis: { plain: "베어링 충격성",      term: "베어링 kurtosis(첨도)",            tip: "가속도 파형이 얼마나 뾰족한지. 정상은 약 3, 박리·소손이면 수십으로 뜁니다." }
  bearing_hf_ratio: { plain: "베어링 고주파",      term: "베어링 고주파 RMS 배율 (정상 대비)", tip: "1 kHz 이상 진동이 정상 기준선의 몇 배인지. 윤활 부족처럼 충격성이 오르지 않는 결함을 받칩니다." }
  bearing:          { plain: "베어링",             term: "베어링 종합 (충격성·고주파 중 나쁜 쪽)", tip: "두 베어링 지표 중 나쁜 등급입니다." }
# 본문 문장 안의 전문 용어 → 쉬운 말 치환 (단순 보기 원인·조치 문장에만 적용). 툴팁에 원문을 남긴다.
replace:
  - { from: "I₂/I₁",       to: "전류 불균형",   tip: "역상 전류비 I₂/I₁ — 세 가닥 전류의 틀어진 정도" }
  - { from: "역상분",       to: "전류 불균형 성분", tip: "역상분(I₂) — 세 상이 서로 어긋나며 생기는 전류 성분" }
  - { from: "ITSC",        to: "턴간 단락",     tip: "ITSC(권선 층간단락) — 코일 선끼리 절연이 깨져 붙어버리는 고장" }
  - { from: "임피던스",     to: "저항(임피던스)", tip: "임피던스 — 교류에서의 전류 저항" }
  - { from: "kurtosis",    to: "충격성(첨도)",  tip: "kurtosis — 파형의 뾰족한 정도" }
  - { from: "BPFO",        to: "외륜 결함 주파수", tip: "BPFO — 베어링 외륜 결함이 만드는 진동 주파수" }
  - { from: "BPFI",        to: "내륜 결함 주파수", tip: "BPFI — 베어링 내륜 결함이 만드는 진동 주파수" }
# 각주·칩 문구
notes:
  persistence: "{s}초 이상 지속될 때만 경보가 올라갑니다"
  hysteresis: "경계 근처에서 색이 깜빡이지 않도록 조금 더 안전해져야 등급이 내려갑니다"
  no_temperature_in_mode: "온도: 이 모드에서는 계산하지 않음"
  provisional_tag: "임시"
  provisional_tip: "실측 기준선 확보 전까지 참고 기준입니다"
  honesty_chip: "시뮬레이션 추정값 · 근거 보기 ›"
  motor_suffix: "해석 기준 모터"
  why: "왜?"
  what: "무엇을?"
  signals_title: "신호 (이 모드에서 계산되는 것만)"
  flow_title: "흐름"
# 임계값 기준표의 "쉬운 설명" 열 (행 키 → 한 문장). 숫자는 쓰지 않는다 — 표의 다른 열이 config 값을 보여준다.
thresholds_easy:
  temp_bearing: "베어링 안의 그리스가 빨리 굳기 시작하는 온도부터 경고, 그 위는 수명이 급격히 줄어 위험"
  temp_winding: "권선 절연(F종)이 견디는 온도에 여유를 둔 경계 — 넘으면 절연 수명이 반으로"
  temp_rotor: "농형 로터는 권선보다 뜨거운 것이 정상이라 경계가 더 높음"
  temp_default: "축·하우징은 베어링 열이 전해지는 부품 — 손으로 만질 수 없을 만큼 뜨거우면 경고"
  current_ratio: "정격보다 많이 흐르면 과부하·단락, 적게 흐르면 한 상이 끊겼거나 짐이 없음"
  i2i1: "세 가닥 전류가 틀어진 정도 — 코일 몇 턴만 붙어도 먼저 반응하는 지표"
  vibration: "베어링 하우징이 흔들리는 세기 — 규격의 '주의/정비/정지' 경계"
  bearing_kurtosis: "진동 파형이 뾰족해지면 구름면이 깨지고 있다는 뜻"
  bearing_hf_ratio: "높은 소리 성분이 평소보다 커지면 윤활 부족을 의심"
