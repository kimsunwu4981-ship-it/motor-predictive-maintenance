# 상태 보드 용어 풀이 (런타임에 읽는다 — 고치고 새로고침). 숫자는 쓰지 않는다: 임계값은 기준표 탭이 config 에서 읽어 보여준다.
items:
  - term: "안전 / 경고 / 위험 (SAFE / WARN / DANGER)"
    text: "모터 전체 상태는 모든 신호 중 가장 나쁜 등급입니다. 어느 신호가 원인인지 항상 같이 표시합니다. 기존 애니메이션의 4단계(정상·주의·경고·위험)는 정상→안전, 주의·경고→경고, 위험→위험으로 대응합니다."
  - term: "원인 신호"
    text: "같은 등급의 신호가 여럿이면 임계값을 가장 크게 넘은 신호를 원인으로 고릅니다. 카드의 한 줄 문구와 '원인과 조치' 패널의 머리글이 이 값입니다."
  - term: "히스테리시스"
    text: "등급이 내려갈 때는 임계값보다 5 % 더 안전한 쪽으로 들어와야 바뀝니다. 경계 근처에서 색이 깜빡이는 것을 막기 위한 규칙입니다."
  - term: "지속 시간 (돌입전류 무시)"
    text: "전류·진동·I₂/I₁·베어링 지표(kurtosis·고주파 배율)는 임계값을 3초 이상 계속 넘어야 등급이 오릅니다. 기동 순간의 큰 돌입전류로 오경보가 나지 않게 하기 위해서입니다. 온도는 느린 신호라 즉시 반영합니다."
  - term: "전류 비율 r = I / I정격"
    text: "상전류 실효값을 그 모터의 정격 선전류로 나눈 값입니다. 모터마다 정격이 달라도 같은 기준으로 판정할 수 있습니다. 너무 커도(과부하·단락) 너무 작아도(결상·무부하) 문제입니다."
  - term: "I₂/I₁ (역상 전류비)"
    text: "세 상의 전류가 얼마나 비대칭인지 나타내는 값입니다. 턴간 단락과 공급전압 불평형에서 커집니다. 4턴 단락이 위험 경계에 걸리도록 임계값을 두었습니다. ITSC 값은 M5 기준 해석식 등가값을 모든 모터에 적용한 것입니다."
  - term: "진동 규격 (ISO 20816-3 Group 2, 강성 지지)"
    text: "다섯 모터 모두 ISO 20816-3 Group 2(15~300 kW 중형기)의 강성 지지 경계를 씁니다: 경고 1.4, 정비 계획 2.8, 위험 4.5 mm/s. 2.2~7.5 kW 는 원래 소형기 규격(10816-1 Class I) 대상이지만, 권상 모터가 구조물에 강성 체결되고 기준을 하나로 두는 편이 설명하기 쉬워 통일했습니다. 공공 실측 데이터(AI Hub) 가이드라인은 같은 규격의 유연 지지 값 4.5 mm/s 를 정상 상한으로 썼습니다."
  - term: "베어링 kurtosis (주 지표)"
    text: "가속도 파형의 첨도입니다. 정상 운전은 정규분포에 가까워 약 3이고, 베어링이 박리·소손되면 충격 때문에 수십으로 뜁니다. 모터 공통 경계를 씁니다. 공공 실측 데이터(AI Hub) 전체 진동 데이터에서 소손 2대는 정상과 완전히 갈렸고, 그리스를 뺀 윤활 부족은 kurtosis 가 정상 범위에 머물렀습니다."
  - term: "베어링 고주파 RMS 배율 (보조 지표)"
    text: "1 kHz 이상 대역의 가속도 RMS 를 그 모터의 정상 기준선으로 나눈 배율입니다. 기준선은 모터별 설정(지금은 같은 용량대 AI Hub 정상 중앙값, 현장 정상 운전 실측으로 바꿀 것)입니다. 윤활 부족처럼 kurtosis 가 오르지 않는 결함을 이 지표가 받칩니다."
  - term: "베어링 종합 등급"
    text: "kurtosis 와 고주파 RMS 배율 중 나쁜 쪽입니다. 포락선 BPFO·BPFI 피크비는 판정에서 뺐고, 베어링 번호를 아는 모터에서 실측이 들어올 때만 '결함 부위 추정(외륜/내륜)' 보조 표시로 남깁니다. 시뮬레이션은 결함별 등가값(소손형은 kurtosis·고주파 모두 급증, 윤활 부족형은 고주파만 상승)을 씁니다."
  - term: "대표 사양 (명판 아님)"
    text: "M1~M4 의 사양은 동급 범용 3상 유도전동기 대표값이고, M5 만 현 프로젝트 도면(JW-01-HTO-00) 값입니다. 명판값을 넣으면 출처 라벨이 nameplate 로 바뀝니다."
  - term: "열회로 계수 스케일"
    text: "온도 모델(9노드 열회로)은 M5 보정값을 출력비·프레임 비례로 스케일한 것입니다. 작은 모터일수록 열용량이 작아 빨리 식고, 결함 손실도 작아 위험 도달이 늦습니다."
