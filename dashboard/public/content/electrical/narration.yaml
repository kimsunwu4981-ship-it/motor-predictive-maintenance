# narration.yaml — 전기적 결함 대시보드 장면별 해설 (원문: 모터결함_애니메이션/애니메이션_해설.pdf 1·3·5장)
#
# 이 파일은 빌드 없이 새로고침만으로 반영된다. 숫자는 절대 직접 쓰지 않는다 — {변수} 는 export 가 로그·config 에서 채운
# public/data/electrical/narration_values.json 의 값으로 화면에서 치환된다.
#
# 장면 종료 값 (narration_values): {a|b|c}_rms_end / _pct_end / _status_end / _phase_rms_end, {a|b|c}_…_start,
#   i2i1_end, i2i1_start, i2i1_x_normal_end, max_pct_end, min_pct_end, bc_rms_end, bc_pct_end, load_pct, short_turns, phase_shift_a_deg
# 공통 (config): rated_line_A, rated_phase_A, line_over_danger_A, line_over_caution_A, line_under_caution_A, line_under_danger_A,
#   phase_over_danger_A, phase_over_caution_A, phase_under_caution_A, phase_under_danger_A, over_danger_pct, over_caution_pct,
#   under_caution_pct, under_danger_pct, i2i1_normal, i2i1_4turn, i2i1_12turn, slowmo_x, lead_s, lead_alarm_t, lead_danger_t, line_phase_factor
# 상 표시 이름: ph_a / ph_b / ph_c (config phase_labels → R·S·T). "A상" 이라고 직접 쓰지 말 것.
# 실시간 (화면이 재생 시각의 로그 값으로 채운다): {a|b|c}_rms_now / _pct_now / _status_now / _phase_rms_now, i2i1_now, i2i1_x_normal_now
#
# focus_phases / focus_i2i1: 장면의 "지금 주목할 것" (사건 우선순위·강조에 쓴다). matrix_label: 판별 매트릭스의 영역 이름.
# circuit: 회로도 표시 (short_loop: A(내부 키)상 권선 단락 루프, open_phase: 끊어진 상, voltage_note: 전원 쪽 정성 표기)
# data_source_note: 그 장면에 짧게 표기할 데이터 출처 (규칙 5). presenter_line 은 발표자 화면에만.

scenes:
  healthy:
    title: "정상, 3상 균형"
    fingerprint: "세 줄 초록 — 기준선"
    focus_phases: [A, B, C]
    focus_i2i1: false
    matrix_label: "정상"
    circuit: {}
    reveal_timing: { why: 0.0, visible: 0.35, result: 0.7 }
    why: "세 상 전압이 고르고 권선이 온전하면 세 전류의 크기가 같고 위상이 120° 씩 벌어져, 역상분(I₂, 세 줄이 서로 어긋난 정도)이 거의 0 입니다."
    visible: "세 케이블 모두 초록 입자가 같은 속도로 흐릅니다. {ph_a} {a_rms_now} / {ph_b} {b_rms_now} / {ph_c} {c_rms_now} A (정격 {rated_line_A} A), I₂/I₁ {i2i1_now}."
    result: "초록이 세 줄, 균형 지표는 {i2i1_end}. 이것이 이후 변화를 판단하는 기준입니다."
    presenter_line: "초록이 세 줄, 균형 지표는 {i2i1_end}. 이게 기준입니다."
    data_source_note: "해석식 3상 모델 (FEM·실측 아님)"
    cause_chain:
      cause: "정격 부하, 고른 3상 전원, 온전한 권선"
      mechanism: "세 상 전류 크기가 같고 120° 간격 → 역상분 ≈ 0"
      effect: "세 줄 초록, I₂/I₁ {i2i1_end}"
      action: "기준선 기록"

  itsc_4turn:
    title: "턴간 단락 초기 (4턴)"
    fingerprint: "한 줄만 붉다"
    focus_phases: [A]
    focus_i2i1: true
    matrix_label: "단락(초기)"
    circuit: { short_loop: A }
    reveal_timing: { why: 0.0, visible: 0.35, result: 0.7 }
    why: "코일 {short_turns}턴의 절연이 깨져 붙으면(ITSC, 권선 층간단락) 그 상의 임피던스가 낮아져 전류가 늘고 균형이 깨집니다."
    visible: "{ph_a}상 케이블과 권선 오버레이가 빨강이 되고 권선 안에 빨간 단락 루프가 나타납니다. {ph_a} {a_rms_now} A (정격의 {a_pct_now} %, {a_status_now}), {ph_b}·{ph_c} 는 {b_rms_now} A 그대로. I₂/I₁ {i2i1_now}."
    result: "코일 몇 턴이 붙었을 뿐인데 균형 지표가 정상의 {i2i1_x_normal_end}배가 됩니다. 크기보다 균형이 먼저 말합니다."
    presenter_line: "코일 몇 턴이 붙었을 뿐인데 균형 지표가 {i2i1_x_normal_end}배 뜁니다. 크기보다 균형이 먼저 말합니다."
    data_source_note: "해석식 등가 표현 — 목표 I₂/I₁ {i2i1_4turn} 을 {ph_a}상 크기 불평형으로 재현. 단락 루프 순환전류는 모델에 없고, 빨간 루프는 위치를 알려주는 시각적 표시"
    cause_chain:
      cause: "코일 {short_turns}턴 절연 파괴 (ITSC)"
      mechanism: "고장 상 임피던스 감소 → {ph_a}상 전류 증가, 위상 어긋남"
      effect: "{ph_a}상만 {a_status_end} ({a_rms_end} A), I₂/I₁ {i2i1_end} (정상의 {i2i1_x_normal_end}배)"
      action: "권선 절연 진단(서지·절연저항), 조기 재권선 계획"

  itsc_12turn:
    title: "턴간 단락 진행 (12턴)"
    fingerprint: "한 줄이 더 붉다"
    focus_phases: [A]
    focus_i2i1: true
    matrix_label: "단락(진행)"
    circuit: { short_loop: A }
    reveal_timing: { why: 0.0, visible: 0.35, result: 0.7 }
    why: "단락 턴이 늘수록 그 상의 전류와 단락 루프의 순환 전류가 커지고, 그 열이 권선을 국부적으로 태웁니다."
    visible: "{ph_a}상이 더 진한 빨강이고 입자가 빨라집니다. {ph_a} {a_rms_now} A (정격의 {a_pct_now} %), I₂/I₁ {i2i1_now}."
    result: "여기까지 오면 예방이 아니라 수리입니다. 목표는 앞 장면(4턴)에서 알리는 것입니다."
    presenter_line: "여기까지 오면 예방이 아니라 수리입니다. 우리 목표는 앞 장면에서 알리는 겁니다."
    data_source_note: "해석식 등가 표현 — 목표 I₂/I₁ {i2i1_12turn} 재현. 단락 루프는 시각적 표시"
    cause_chain:
      cause: "단락 범위 확대 ({short_turns}턴)"
      mechanism: "{ph_a}상 전류·루프 순환 전류 증가, 국부 발열"
      effect: "{ph_a}상 {a_rms_end} A ({a_pct_end} %), I₂/I₁ {i2i1_end}"
      action: "정지 후 재권선 — 예방 시점을 놓친 상태"

  itsc_8turn:
    title: "턴간 단락 확대 (8턴)"
    fingerprint: "한 줄이 더 붉다"
    focus_phases: [A]
    focus_i2i1: true
    matrix_label: "단락(확대)"
    circuit: { short_loop: A }
    reveal_timing: { why: 0.0, visible: 0.35, result: 0.7 }
    why: "붙은 턴이 {short_turns}턴으로 늘면 단락 루프의 순환 전류와 그 열이 커지고, 세 상 전류의 균형이 더 크게 깨집니다."
    visible: "{ph_a}상이 더 진한 빨강입니다. {ph_a} {a_rms_now} A (정격의 {a_pct_now} %), I₂/I₁ {i2i1_now}."
    result: "균형 지표가 위험 경계를 넘습니다 — 확실히 탐지되는 단계입니다."
    data_source_note: "등가회로 LUT — 턴 수·접촉 저항·부하로 보간. 단락 루프는 시각적 표시"
    cause_chain:
      cause: "단락 범위 확대 ({short_turns}턴, 접촉 저항 {r_f_ohm} Ω)"
      mechanism: "루프 순환 전류 {i_f_A} A · 추가 손실 {p_loop_W} W → {ph_a}상 전류 증가, 균형 붕괴"
      effect: "{ph_a}상 {a_rms_end} A ({a_pct_end} %), I₂/I₁ {i2i1_end}"
      action: "즉시 정비 계획 — 권선 절연 진단 후 재권선"
  itsc_16turn:
    title: "턴간 단락 코일 전체 (16턴)"
    fingerprint: "한 줄이 과전류"
    focus_phases: [A]
    focus_i2i1: true
    matrix_label: "단락(코일 전체)"
    circuit: { short_loop: A }
    reveal_timing: { why: 0.0, visible: 0.35, result: 0.7 }
    why: "코일 한 개({short_turns}턴)가 통째로 붙으면 그 상의 저항(임피던스)이 크게 줄어 선전류 자체가 과전류 영역으로 들어갑니다."
    visible: "{ph_a}상이 짙은 빨강이고 입자가 가장 빠릅니다. {ph_a} {a_rms_now} A (정격의 {a_pct_now} %), I₂/I₁ {i2i1_now}."
    result: "균형 지표와 전류 크기 둘 다 위험입니다 — 더 두면 권선이 탑니다."
    data_source_note: "등가회로 LUT 격자 끝(턴 16.7 %) — 외삽 없음"
    cause_chain:
      cause: "코일 전체 단락 ({short_turns}턴)"
      mechanism: "{ph_a}상 임피던스 급감 → 선전류 과전류, 루프 손실 {p_loop_W} W"
      effect: "{ph_a}상 {a_rms_end} A ({a_pct_end} %, {a_status_end}), I₂/I₁ {i2i1_end}"
      action: "정지 — 재권선 (예방 시점을 놓친 상태)"
  itsc_4turn_resistive:
    title: "턴간 단락 4턴, 접촉이 느슨함 (저항성)"
    fingerprint: "거의 초록"
    focus_phases: [A]
    focus_i2i1: true
    matrix_label: "단락(저항성)"
    circuit: { short_loop: A }
    reveal_timing: { why: 0.0, visible: 0.35, result: 0.7 }
    why: "같은 {short_turns}턴이 붙어도 접촉 저항이 {r_f_ohm} Ω 으로 크면 순환 전류가 작아 세 상 균형이 거의 깨지지 않습니다. 탐지를 가르는 것은 턴 수가 아니라 '얼마나 세게 붙었나' 입니다."
    visible: "세 줄이 거의 초록입니다. {ph_a} {a_rms_now} A, I₂/I₁ {i2i1_now}."
    result: "경계 아래라 안전으로 남습니다 — 초기 절연 열화는 이 지표만으로는 보이지 않습니다."
    data_source_note: "등가회로 LUT (R_f 1.0 Ω 격자 끝)"
    cause_chain:
      cause: "코일 {short_turns}턴 절연 약화, 접촉 저항 {r_f_ohm} Ω"
      mechanism: "순환 전류 {i_f_A} A 로 작음 → 균형 거의 유지"
      effect: "I₂/I₁ {i2i1_end} (경계 아래), 추가 손실 {p_loop_W} W"
      action: "정기 절연 진단(서지·절연저항)으로만 잡힘 — 추세 감시"
  itsc_4turn_halfload:
    title: "턴간 단락 4턴, 반부하 (50 %)"
    fingerprint: "한 줄만 붉고 모두 낮다"
    focus_phases: [A]
    focus_i2i1: true
    matrix_label: "단락(경부하)"
    circuit: { short_loop: A }
    reveal_timing: { why: 0.0, visible: 0.35, result: 0.7 }
    why: "부하가 {load_pct} % 로 낮으면 정상분 전류(I₁)가 작아져 같은 단락이라도 균형 비율 I₂/I₁ 은 더 크게 보입니다. 그래서 부하와 무관한 I₂/I_n 을 함께 봅니다."
    visible: "세 상 전류가 모두 정격보다 낮고 {ph_a}상만 상대적으로 큽니다. {ph_a} {a_rms_now} A (정격의 {a_pct_now} %), I₂/I₁ {i2i1_now}, I₂/I_n {i2_over_in_now}."
    result: "경부하에서도 단락은 균형 지표로 드러납니다 — 다만 비율 해석에 부하를 함께 봐야 합니다."
    data_source_note: "등가회로 LUT 부하 50 % 격자 — I₁ 은 LUT 정상분 (D3)"
    cause_chain:
      cause: "코일 {short_turns}턴 단락, 부하 {load_pct} %"
      mechanism: "I₁ 감소로 I₂/I₁ 상승, I₂/I_n 은 부하 무관"
      effect: "{ph_a}상 {a_rms_end} A ({a_pct_end} %), I₂/I₁ {i2i1_end} · I₂/I_n {i2_over_in_now}"
      action: "부하를 함께 기록하고 절연 진단 계획"
  overload:
    title: "과부하 운전"
    fingerprint: "세 줄이 같이 붉다"
    focus_phases: [A, B, C]
    focus_i2i1: true
    matrix_label: "과부하"
    circuit: {}
    reveal_timing: { why: 0.0, visible: 0.35, result: 0.7 }
    why: "무거운 짐을 들면 세 상이 똑같이 더 많은 전류를 끌어옵니다. 균형은 유지되므로 역상분이 없습니다."
    visible: "세 케이블이 함께 빨강, 입자가 모두 빨라집니다. {ph_a}·{ph_b}·{ph_c} 모두 {a_rms_now} A (정격의 {a_pct_now} %). 그런데 I₂/I₁ 은 {i2i1_now}."
    result: "크기는 문제, 균형은 정상 — 과부하와 권선 단락을 구분하는 단서입니다. 세 줄이 같이 붉으면 과부하, 한 줄만 붉으면 단락."
    presenter_line: "세 줄이 같이 붉으면 과부하, 한 줄만 붉으면 단락입니다. 균형 지표가 그걸 갈라 줍니다."
    data_source_note: "해석식 3상 모델 — 전류가 부하에 비례한다고 단순화, 부하 {load_pct} % → 정격의 {a_pct_end} %"
    cause_chain:
      cause: "정격 초과 하중 (부하 {load_pct} %)"
      mechanism: "세 상 전류가 같은 비율로 증가, 위상 간격 유지"
      effect: "세 상 모두 {a_status_end} ({a_rms_end} A), I₂/I₁ {i2i1_end}"
      action: "하중 제한, 권선 온도 추세 감시"

  voltage_unbalance:
    title: "공급전압 불평형"
    fingerprint: "색은 정상, 숫자만 열 배"
    focus_phases: []
    focus_i2i1: true
    matrix_label: "전압 불평형"
    circuit: { voltage_note: "공급전압 불평형 (원인 · 모델 입력 아님)" }
    reveal_timing: { why: 0.0, visible: 0.35, result: 0.7 }
    why: "공급 전압이 상마다 몇 % 만 달라도 전류 불평형은 그보다 훨씬 크게 나타납니다. 크기 기준으로는 아직 정상이지만 균형은 이미 무너졌습니다."
    visible: "케이블 색은 세 상 모두 초록({ph_a} {a_rms_now} / {ph_b} {b_rms_now} / {ph_c} {c_rms_now} A, 전부 정상 범위)인데 I₂/I₁ 만 {i2i1_now} 으로 정상값의 {i2i1_x_normal_now}배입니다."
    result: "색은 아직 다 초록인데 숫자는 {i2i1_x_normal_end}배 올랐습니다. 색만 보면 놓치고, 숫자를 보면 잡습니다."
    presenter_line: "색은 아직 다 초록입니다. 그런데 숫자는 열 배가 올랐습니다. 색만 보면 놓치고, 숫자를 보면 잡습니다."
    data_source_note: "해석식 3상 모델 — 이 모델은 전압을 입력으로 쓰지 않아, 전압 불평형이 만드는 전류 불평형(크기·위상)을 직접 넣었다. 전압 숫자는 없다"
    cause_chain:
      cause: "상별 공급전압 차이 (전원·배선 문제)"
      mechanism: "작은 전압 차 → 훨씬 큰 전류 불평형, 크기는 정상 범위"
      effect: "세 상 {a_status_end}, I₂/I₁ {i2i1_end} (정상의 {i2i1_x_normal_end}배)"
      action: "전원 측 전압 불평형 점검 (변압기·접속부), 균형 지표로 감시"

  single_phasing:
    title: "결상 (R상 끊김)"
    fingerprint: "한 줄 파랑, 두 줄 빨강"
    focus_phases: [A, B, C]
    focus_i2i1: true
    matrix_label: "결상"
    circuit: { open_phase: A }
    reveal_timing: { why: 0.0, visible: 0.35, result: 0.7 }
    why: "한 상이 끊기면 남은 두 상만으로 같은 힘을 내려고 하므로 그 두 상에 전류가 몰립니다."
