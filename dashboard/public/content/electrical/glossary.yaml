# glossary.yaml — 용어 풀이 (전기). Q 서랍 아래쪽에 나온다. 정성적 설명만 쓰고, 출처 없는 배율 수치는 쓰지 않는다.
# 숫자는 변수로 — narration_values 의 공통 값(rated_line_A 등)을 쓴다.

items:
  - term: "선전류 · 상전류 (Δ결선)"
    text: "케이블에 흐르는 전류가 선전류(정격 {rated_line_A} A), 권선 한 상 안에 흐르는 전류가 상전류(정격 {rated_phase_A} A)다. 델타결선에서는 둘이 √3 배 차이 난다. 화면의 색 판정은 각각 자기 정격 기준으로 하므로 어느 값을 보든 결과는 같다."
  - term: "RMS (실효값)"
    text: "1초에 60번 방향이 바뀌는 교류 전류의 '평균적인 크기'. 같은 열을 내는 직류 값으로 환산한 것이라 정격·임계값은 모두 RMS 로 적는다."
  - term: "I₂/I₁ (역상분 비율)"
    text: "세 상 전류를 '정상분(세 줄이 고르게 도는 성분)'과 '역상분(세 줄이 서로 어긋난 성분)'으로 나눈 뒤 그 비율을 낸 것. 정상 {i2i1_normal}, 4턴 단락 {i2i1_4turn}, 12턴 단락 {i2i1_12turn}. 크기가 정상이어도 균형이 깨지면 이 값이 오른다."
  - term: "페이저 (phasor)"
    text: "교류 한 상을 화살표 하나로 그린 것. 길이가 전류 크기, 각도가 위상(타이밍). 세 화살표가 같은 길이로 120° 씩 벌어져 있으면 균형이다."
  - term: "ITSC (권선 층간단락, 턴간 단락)"
    text: "한 코일 안에서 이웃한 감김(턴)끼리 절연이 깨져 붙는 고장. 그 상의 임피던스가 낮아져 전류가 늘고 균형이 깨진다. 이 시뮬레이션은 목표 I₂/I₁ 을 크기 불평형으로 재현한 등가 표현이며, 실제 단락 루프의 순환전류는 모델에 없다."
  - term: "결상 (single phasing)"
    text: "세 상 가운데 하나가 끊긴 상태. 끊긴 상은 전류가 거의 0(파랑), 남은 두 상이 부하를 떠안아 과전류(빨강)가 된다. 가장 급히 세워야 하는 상태."
  - term: "전압과 전류의 관계"
    text: "화면의 빨강·파랑은 전류다. 전압 이상은 전류 이상의 '원인' 쪽이다. 저전압이면 모터가 같은 힘을 내려고 전류를 더 끌어와 과전류(빨강)가 되고, 과전압은 무부하·경부하에서 여자전류를 늘려 전류와 철손을 키운다. 상별 전압이 조금만 달라도(전압 불평형) 전류 불평형은 훨씬 크게 나타나 I₂/I₁ 이 먼저 오른다. 이 관계는 정성적 설명이며, 이 모델은 전압을 입력으로 쓰지 않는다."
  - term: "슬로모션"
    text: "실제 전류는 60 Hz 라 눈으로 볼 수 없다. 영상과 회로도의 입자는 {slowmo_x}배 느리게 그려 1초에 한 주기가 보이게 했다. 입자 속도는 전류 크기에 비례한다."
