# qa.yaml — 예상 질문과 답 (해설 PDF 7장 중 전기적 결함 관련). Q 키로 여는 서랍에 나온다.
# 숫자는 변수로 쓴다 — 값은 narration_values.json 의 지정 장면에서 채운다.

items:
  - q: "전류는 전자계 해석 결과인가요?"
    a: "아닙니다. 해석식 3상 모델입니다. 턴간 단락은 문헌의 목표 I₂/I₁({i2i1_4turn} / {i2i1_12turn})을 크기 불평형으로 재현한 등가 표현이라, 실제 단락처럼 단락 루프 순환전류가 지배하는 파형은 아닙니다. 그래서 전기 쪽 리드 타임을 {lead_s} 초로 정직하게 표시했습니다."
    scene: itsc_4turn
  - q: "과전압·저전압은 왜 안 보이나요?"
    a: "이 영상의 빨강·파랑은 전류입니다. 전압 이상은 전류 이상의 원인 쪽입니다. 예를 들어 저전압에서는 모터가 같은 힘을 내려고 전류를 더 끌어와 오히려 빨강이 되고, 전압 불평형은 훨씬 큰 전류 불평형(장면 5, I₂/I₁ 정상의 {i2i1_x_normal_end}배)으로 나타납니다. 이 모델은 전압을 입력으로 쓰지 않아 전압 숫자는 화면에 없습니다."
    scene: voltage_unbalance
  - q: "2.2 kW 모터 아니었나요?"
    a: "이 프로젝트의 3D 모델·시뮬레이션은 도면(JW-01-HTO-00)의 22 kW 6극 크레인 권상 모터를 기준으로 합니다. 정격 선전류 {rated_line_A} A, 상전류 {rated_phase_A} A 도 그 기준입니다."
    scene: healthy
  - q: "선전류와 상전류가 왜 따로 있나요?"
    a: "Δ(델타)결선이라 케이블에 흐르는 선전류(정격 {rated_line_A} A)와 권선 안의 상전류(정격 {rated_phase_A} A)가 √3 배 다릅니다. 색 판정은 각각의 정격을 기준으로 하므로 결과는 같고, 상단 토글(L 키)로 어느 값을 볼지 바꿀 수 있습니다."
    scene: healthy
  - q: "I₂/I₁이 뭔가요? 왜 이걸 보나요?"
    a: "세 줄의 전류가 서로 얼마나 어긋났는지를 나타내는 숫자(역상분 비율)입니다. 정상 {i2i1_normal}, 4턴 단락 {i2i1_4turn}, 12턴 단락 {i2i1_12turn}. 과부하는 세 줄이 같이 커서 이 값이 0에 가깝고, 전압 불평형은 색이 모두 정상인데 이 값만 오릅니다. 크기(색)와 균형(이 숫자)을 함께 봐야 결함을 구분할 수 있습니다."
    scene: voltage_unbalance
  - q: "과부하 장면의 전류가 정격의 {a_pct_end} %인 근거는요?"
    a: "이 해석식 모델은 정상 운전 영역에서 전류가 부하에 비례한다고 단순화합니다. 그래서 부하 {load_pct} % 시나리오의 세 상 전류가 모두 정격의 {a_pct_end} %({a_rms_end} A)입니다. 실제 유도전동기의 부하-전류 관계는 완전히 선형은 아니며, 이 값은 시뮬레이션 기반 추정값입니다."
    scene: overload
