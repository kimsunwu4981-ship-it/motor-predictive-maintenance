# qa.yaml — 예상 질문과 답 (해설 PDF 7장 중 기계적 결함 관련). Q 키로 여는 서랍에 나온다.
# 숫자는 변수로 쓴다 — 값은 narration_values.json 의 첫 장면(normal) 또는 지정 장면에서 채운다.

items:
  - q: "이 온도가 실제 측정값인가요?"
    a: "아닙니다. 부품 9개를 각각 한 덩어리로 본 열회로 모델의 추정값이고, 화면에 항상 그렇게 표시돼 있습니다. 모델의 임계값(베어링 {bearing_de_normal}/{bearing_de_caution}/{bearing_de_warning} °C, 권선 {winding_normal}/{winding_caution}/{winding_warning} °C)은 그리스 수명과 F종 절연 기준에서 가져왔습니다."
    scene: normal
  - q: "베어링이 {bearing_de_end} °C 면 이미 망가진 것 아닌가요?"
    a: "맞습니다. 그래서 VIGENT 는 그 훨씬 전인 {bearing_de_normal} °C(주의)에서 경보를 냅니다. 영상은 발표 시간 안에 보여주려고 열 시뮬레이션을 60~150배 빨리 돌린 것이고, '위험까지 가면 이렇게 된다'를 보여주는 장면입니다."
    scene: bearing_fault
  - q: "왜 결함을 하나씩만 켰나요?"
    a: "겹치면 손실 배율이 곱해져 물리적으로 불가능한 온도가 나오고, 무엇보다 어느 결함이 어느 부품을 달구는지 구분이 안 됩니다. 하나씩 켜야 결함마다 다른 '지문'이 보입니다."
    scene: normal
  - q: "화면의 시간이 실제 시간인가요?"
    a: "아닙니다. 화면 1초는 열 시뮬레이션에서 {time_scale}초입니다(장면마다 다르며 상단에 표시). 실제 모터는 이렇게 빨리 뜨거워지지 않습니다 — 발표 시간 안에 보여주기 위한 압축입니다."
    scene: bearing_fault
  - q: "2.2 kW 모터 아니었나요?"
    a: "이 프로젝트의 3D 모델·애니메이션·해설 대시보드는 모터 라이브러리 M1~M5(1톤 2.2 kW ~ 15~20톤 22 kW) 중 M5(22 kW 6극, 도면 JW-01-HTO-00)를 기준으로 만든 것입니다. 2.2 kW 급은 M1(1톤 호이스트)로 라이브러리에 있고, 상태 보드에서 같은 시나리오·같은 판정 기준으로 볼 수 있습니다."
    scene: normal
  - q: "진동 등급은 무슨 기준인가요?"
    a: "ISO 20816-3 Group 2(15~300 kW, 강성 지지) 기준으로 주시·정비 계획·즉시 조치 세 경계를 씁니다. 베어링 결함이나 정렬 불량은 온도보다 진동에서 먼저 드러나는 경우가 많아 온도와 진동을 함께 봅니다."
    scene: misalignment
