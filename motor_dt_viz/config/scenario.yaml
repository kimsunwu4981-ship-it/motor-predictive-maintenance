# scenario.yaml — 자동 재생 시나리오 타임라인과 자막 (CLAUDE.md §7)
#
# duration_s 는 실제 벽시계 시간(발표 시간), time_scale 은 그 구간의 열 시뮬레이션 배속이다.
# 총 재생 시간 ≈ 165 s (2분 45초)

# subtitle    : 한국어 자막 (발표 자료·녹화 편집 자막용)
# subtitle_en : HUD 표시용 영문 (omni.ui 기본 폰트에 한글 글리프가 없음 — Phase 3 실측)
playback:
  total_target_s: 165
  subtitle_font_size: 26
  hud_update_hz: 15

steps:
  - id: normal
    label: "1. 정상 운전"
    subtitle: "모든 부품 정상 온도, 3상 전류 균형 — I₂/I₁ 0.006"
    subtitle_en: "All components at normal temperature, balanced 3-phase current (I2/I1 = 0.006)"
    duration_s: 30
    time_scale: 60            # 열 시뮬레이션 ×60 → 30초에 30분 누적
    mode: integrated
    electrical_case: healthy
    faults: []
    load: 1.0

  - id: bearing_fault
    label: "2. DE 베어링 열화 진행"
    subtitle: "구동측 베어링 온도 상승 → 경고 (진동 4.8 mm/s, ISO 20816-3 Act 초과)"
    subtitle_en: "DE bearing temperature rising -> WARNING (vibration 4.8 mm/s, above ISO 20816-3 Act)"
    duration_s: 40
    time_scale: 120
    mode: integrated
    electrical_case: healthy
    faults: [bearing_de_fault]
    load: 1.0

  - id: itsc_4turn
    label: "3. 턴간 단락 초기 (4턴)"
    subtitle: "I₂/I₁ 0.006 → 0.104 — 조기 감지 가능 구간"
    subtitle_en: "I2/I1 rises 0.006 -> 0.104 : early detection window"
    duration_s: 35
    time_scale: 120
    mode: integrated
    electrical_case: itsc_4turn
    faults: [bearing_de_fault]
    load: 1.0

  - id: itsc_12turn
    label: "4. 턴간 단락 진행 (12턴)"
    subtitle: "I₂/I₁ 0.269 — 단락 전류 증가 → 권선 과열"
    subtitle_en: "I2/I1 = 0.269 : short-circuit current grows -> stator winding overheating"
    duration_s: 45
    time_scale: 180
    mode: integrated
    electrical_case: itsc_12turn
    faults: [bearing_de_fault]
    load: 1.0

  - id: conclusion
    label: "5. 결론"
    subtitle: "VIGENT는 이 시점 이전에 경보를 보냅니다 — 조기 감지로 정지 손실을 막습니다"
    subtitle_en: "VIGENT raises the alarm before this point - early detection prevents downtime"
    duration_s: 15
    time_scale: 60
    mode: integrated
    electrical_case: itsc_12turn
    faults: [bearing_de_fault]
    load: 1.0
    highlight: true

# 수동 모드 기본값 (제어 패널 초기 상태)
manual_defaults:
  mode: integrated            # thermal | electrical | integrated
  load: 1.0
  time_scale: 60
  slowmo_factor: 0.016667
  electrical_case: healthy
  faults: []
