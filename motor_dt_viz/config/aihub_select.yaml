# aihub_select.yaml — AI Hub 「기계시설물 고장 예지 센서」(dataSetSn=238) 선별 기준 (TASK_AIHub_데이터선별 §2)
# 코드에는 kW·결함 이름을 쓰지 않는다. 샘플 단계(TASK_AIHub_샘플)에서는 전부 변환하고, 매핑에 없는 용량은 motor_id=None 으로 둔다.

# 우리 모터 라이브러리(M1~M5)와 대응하는 용량만 (전체 데이터 선별 추출용)
power_kw: [2.2, 5.5, 7.5, 15, 22]

# 애니메이션 장면과 겹치는 결함만 (라벨 번호는 샘플·AI Hub 페이지에서 확인: docs/aihub_structure.md §5)
labels:
  include: ["정상", "베어링불량", "축정렬불량"]
  exclude: ["벨트느슨함", "회전체불평형"]     # 벨트: 권상 모터에 없음. 불평형: 2차 과제
label_no: { "00": "정상", "01": "베어링불량", "02": "회전체불평형", "03": "축정렬불량", "04": "벨트느슨함" }

# 1차는 진동만. 전류는 3상 확인됨(S0) → 2차에서 I₂/I₁
signals: ["vibration"]

# 균형 샘플링 (L2용). 모터·라벨 조합당 상한
sample_per_motor_label: 2000
random_seed: 42

# 매핑: AI Hub 용량 → 우리 모터 ID
motor_map: { 2.2: M1, 5.5: M2, 7.5: M3, 15: M4, 22: M5 }
