# scenario_mechanical.yaml — 기계적 결함 전용 자동 재생 시나리오
#
# 전류 시각화(경로·입자·권선 오버레이)와 전류 HUD 는 이 모드에서 전부 꺼진다.
# 권선 발열은 모듈 B 전류가 아니라 **부하율 기반 자체 동손 모델**로 계산한다
#   (thermal_model.losses: winding_current_pu 가 None 이면 eff_load 로 대체)
#
# 단계마다 해당 결함만 켠다(누적 금지). 결함을 쌓으면 loss_multiplier 가 곱해져
# 베어링 483 °C 같은 물리적으로 불가능한 값이 나온다 — 실측으로 확인했다.
#
# duration_s 는 실제 벽시계 시간(발표 시간), time_scale 은 그 구간의 열 시뮬레이션 배속이다.
# 총 재생 시간 = 180 s (3분)
#
# subtitle    : 한국어 자막 (발표 자료·녹화 편집 자막용)
# subtitle_en : HUD 표시용 영문 (omni.ui 기본 폰트에 한글 글리프가 없음 — Phase 3 실측)
# source      : 화면에 표시할 데이터 출처 (정직성 표기)

playback:
  total_target_s: 180
  subtitle_font_size: 26
  hud_update_hz: 15

steps:
  - id: normal
    label: "1. 정상 운전"
    subtitle: "모든 부품이 정상 온도 범위 — 원래 재질 색 그대로"
    subtitle_en: "All components within normal temperature - original material colors"
    source: "집중정수 열회로 9노드 모델"
    source_en: "Lumped thermal network, 9 nodes"
    duration_s: 25
    time_scale: 60
    mode: mechanical
    electrical_case: healthy
    faults: []
    load: 1.0

  - id: bearing_fault
    label: "2. DE 베어링 열화"
    subtitle: "구동측 베어링 마찰 증가 → 온도 상승, 진동 4.8 mm/s (ISO 20816-3 Act 초과)"
    subtitle_en: "DE bearing friction rises -> temperature climbs, vibration 4.8 mm/s (above ISO 20816-3 Act)"
    source: "베어링 손실 배율 + 전도 저항 악화 모델"
    source_en: "Bearing loss multiplier + degraded conduction model"
    duration_s: 35
    time_scale: 120
    mode: mechanical
    electrical_case: healthy
    faults: [bearing_de_fault]
    load: 1.0

  - id: misalignment
    label: "3. 축 정렬 불량"
    subtitle: "커플링 정렬이 틀어져 양쪽 베어링 하중이 늘고 축 온도가 함께 오른다"
    subtitle_en: "Shaft misalignment increases load on both bearings - shaft heats up as well"
    source: "부하 배율 + 베어링 손실 증가 모델"
    source_en: "Load multiplier + increased bearing loss"
    duration_s: 25
    time_scale: 120
    mode: mechanical
    electrical_case: healthy
    faults: [misalignment]
    load: 1.0

  - id: fan_failure
    label: "4. 냉각팬 고장"
    subtitle: "외부 방열이 막혀 하우징부터 권선까지 전체 온도가 밀려 올라간다"
    subtitle_en: "Cooling fan failure blocks heat rejection - the whole motor heats up"
    source: "대류 열저항 증가 모델"
    source_en: "Increased convective thermal resistance"
    duration_s: 25
    time_scale: 120
    mode: mechanical
    electrical_case: healthy
    faults: [fan_failure]
    load: 1.0

  - id: brake_drag
    label: "5. 브레이크 끌림"
    subtitle: "제동면이 완전히 떨어지지 않아 마찰열이 축을 타고 들어온다"
    subtitle_en: "Brake fails to fully release - friction heat enters through the shaft"
    source: "축 노드 발열 주입 모델"
    source_en: "Heat injected at the shaft node"
    duration_s: 20
    time_scale: 120
    mode: mechanical
    electrical_case: healthy
    faults: [brake_drag]
    load: 1.0

  - id: overload
    label: "6. 과부하 운전 (열 관점)"
    subtitle: "부하가 정격을 넘으면 동손이 제곱으로 늘어 권선이 가장 먼저 한계에 닿는다"
    subtitle_en: "Above rated load, copper loss grows with the square of current - the winding reaches its limit first"
    source: "부하율 기반 동손 I²R 모델"
    source_en: "Load-based copper loss (I2R) model"
    duration_s: 30
    time_scale: 150
    mode: mechanical
    electrical_case: healthy
    faults: [overload]
    load: 1.0                    # 배율은 overload 결함이 담당(이중 적용 방지)

  - id: cooldown
    label: "7. 결함 해제 후 냉각"
    subtitle: "정비로 결함을 제거하면 온도가 내려간다 — 조기 대응이 가능한 구간"
    subtitle_en: "After maintenance clears the faults, temperatures fall - the window where early action pays off"
    source: "집중정수 열회로 9노드 모델"
    source_en: "Lumped thermal network, 9 nodes"
    duration_s: 20
    time_scale: 150
    mode: mechanical
    electrical_case: healthy
    faults: []
    load: 1.0
    highlight: true

# 수동 모드 기본값 (제어 패널 초기 상태)
manual_defaults:
  mode: mechanical
  load: 1.0
  time_scale: 120
  slowmo_factor: 0.016667
  electrical_case: healthy
  faults: []
