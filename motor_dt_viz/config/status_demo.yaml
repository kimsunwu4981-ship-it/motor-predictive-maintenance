# status_demo.yaml — 상태 보드(#/status) 데모 위치 (파트 C P2′, 2026-10-21: 단일 모터 M1)
#
# 모터 카드는 M1 한 장. positions.M1 은 첫 화면의 기본 시각(모드·재생 시간 s), scene_map 은 재생 바 위 빠른 이동 칩(시나리오 시각 → 기대 상태).
# 상태는 판정 엔진 결과(logs/fleet/M1/<mode>/status_fleet.csv)를 그대로 읽는다 — 여기서 상태를 정하지 않는다.
# 바꾸고 나면 dashboard/tools/export_status_data.py 를 다시 실행한다 (테스트가 기대 상태와 실제 판정을 대조한다).
note: "단일 모터 M1(현대 HLP-2.2/4). 실측 연결 전까지 모든 상태는 시뮬레이션 로그(판정 엔진)에서 온다."
positions:
  M1: { mode: electrical, t_s: 40.0, expect: WARN, why: "턴간 단락 초기(4턴) — I₂/I₁ 0.0726 (경고 경계 0.05 바로 위, 임시 기준)" }
scene_map:                       # 첫 화면 재생 바 칩: 정상 → 4턴 경계 → 12턴 위험 → 베어링 경고 → 과부하
  - { id: healthy,     label: "정상",            mode: electrical, t_s: 15.0,  expect: SAFE }
  - { id: itsc_4turn,  label: "4턴 경계(경고)",  mode: electrical, t_s: 40.0,  expect: WARN }
  - { id: itsc_12turn, label: "12턴 위험",       mode: electrical, t_s: 60.0,  expect: DANGER }
  - { id: bearing,     label: "DE 베어링 경고",  mode: mechanical, t_s: 27.5,  expect: WARN }
  - { id: overload,    label: "과부하 위험",     mode: electrical, t_s: 85.0,  expect: DANGER }
