# scenarios_M1.yaml — M1(현대 HLP-2.2/4) 전용 시나리오 (P4 후속 A3, 2026-10-21). 기존 scenario_electrical.yaml(22 kW 공용)은 불변.
#
# mechanical / integrated: 공용 scenario_mechanical.yaml / scenario.yaml 과 같은 장면·배속, 자막만 M1 값 (파트 C S2, 2026-10-21).
# electrical: 기존 7 장면(정상·4턴·12턴·과부하·불평형·결상·무부하) + 4 장면(8턴·16턴·저항성 4턴 R_f 1.0 Ω·반부하 4턴 50 %).
# extra_cases: electrical.yaml 에 없는 케이스는 electrical.yaml 의 템플릿(itsc_4turn)을 런타임에 복사해 lut {turns, R_f_ohm}·load·label 만 바꿔 등록한다
#   (viz/m1_model.M1Model.register_extra_cases). electrical.yaml·LUT 는 건드리지 않는다. 값은 LUT 격자(턴 0~16.7 %, R_f 0.03~1.0 Ω, 부하 25~115 %) 안.
# 설계 I₂/I₁ 참고(LUT v2 + 고유 비대칭 0.027, 위상 0° 합): 8턴 ≈ 0.171, 16턴 ≈ 0.365, 4턴 R_f 1.0 ≈ 0.034, 4턴 50 % ≈ 0.102 — 실제 값은 장면 실행 로그(check_m1_scene)로 확인.

extra_cases:
  itsc_8turn:
    template: itsc_4turn
    label: "턴간 단락 8턴 (확실 탐지 시작)"
    turns: 8
    R_f_ohm: 0.1
    load: 1.0
  itsc_16turn:
    template: itsc_4turn
    label: "턴간 단락 16턴 (코일 전체)"
    turns: 16
    R_f_ohm: 0.1
    load: 1.0
  itsc_4turn_resistive:
    template: itsc_4turn
    label: "턴간 단락 4턴 저항성 (R_f 1.0 Ω)"
    turns: 4
    R_f_ohm: 1.0
    load: 1.0
  itsc_4turn_halfload:
    template: itsc_4turn
    label: "턴간 단락 4턴 반부하 (50 %)"
    turns: 4
    R_f_ohm: 0.1
    load: 0.5

electrical:
  steps:
    - id: healthy
      label: "1. 정상 (3상 균형)"
      subtitle: "세 상이 같은 크기, I₂/I₁ 은 고유 비대칭 0.027 뿐"
      subtitle_en: "Three balanced phases - I2/I1 is only the inherent 0.027"
      source: "등가회로 LUT (RMxprt v2m2 + MCCM) + 고유 비대칭"
      source_en: "Equivalent-circuit LUT (RMxprt v2m2 + MCCM) + inherent asymmetry"
      duration_s: 20
      time_scale: 60
      mode: electrical
      electrical_case: healthy
      faults: []
      load: 1.0
    - id: itsc_4turn
      label: "2. 턴간 단락 초기 (4턴)"
      subtitle: "Coil_01 의 4턴(2.1 %)이 단락 — 단락 루프 전류 34 A, I₂/I₁ 0.073 (경계 0.05 바로 위)"
      subtitle_en: "4 turns (2.1 %) of Coil_01 shorted - loop current 34 A, I2/I1 0.073 (just above 0.05)"
      source: "등가회로 LUT + 2D 와전류 정합 (I_f ±5 %)"
      source_en: "Equivalent-circuit LUT + 2D eddy-current match (I_f within 5 %)"
      duration_s: 25
      time_scale: 60
      mode: electrical
      electrical_case: itsc_4turn
      faults: []
      load: 1.0
      highlight: true
    - id: itsc_12turn
      label: "3. 턴간 단락 진행 (12턴)"
      subtitle: "12턴(6.3 %) 단락 — 루프 전류 70 A, 손실 977 W, I₂/I₁ 0.27 (위험)"
      subtitle_en: "12 turns (6.3 %) shorted - loop current 70 A, 977 W, I2/I1 0.27 (danger)"
      source: "등가회로 LUT"
      source_en: "Equivalent-circuit LUT"
      duration_s: 30
      time_scale: 60
      mode: electrical
      electrical_case: itsc_12turn
      faults: []
      load: 1.0
      highlight: true
    - id: overload
      label: "4. 과부하 운전"
      subtitle: "세 상이 고르게 함께 늘어난다 — 균형이 유지되므로 I₂/I₁ 은 고유 비대칭 그대로"
      subtitle_en: "All three phases rise together - balance holds, I2/I1 stays at the inherent level"
      source: "해석식 3상 모델"
      source_en: "Analytic 3-phase model"
      duration_s: 20
      time_scale: 60
      mode: electrical
      electrical_case: overload
      faults: []
      load: 1.35
    - id: voltage_unbalance
      label: "5. 공급전압 불평형"
      subtitle: "크기는 아직 정상 범위지만 I₂/I₁ 이 0.060 으로 오른다 — 크기보다 균형이 먼저 무너진다"
      subtitle_en: "Magnitudes still look normal, but I2/I1 rises to 0.060 - balance breaks before magnitude"
      source: "해석식 3상 모델"
      source_en: "Analytic 3-phase model"
      duration_s: 25
      time_scale: 60
      mode: electrical
      electrical_case: voltage_unbalance
      faults: []
      load: 1.0
    - id: single_phasing
      label: "6. 결상 (R상 끊김)"
      subtitle: "끊긴 상은 파랑, 남은 두 상이 그 몫까지 떠안아 빨강이 된다"
      subtitle_en: "The lost phase turns blue; the remaining two carry its share and turn red"
      source: "해석식 3상 모델"
      source_en: "Analytic 3-phase model"
      duration_s: 25
      time_scale: 60
      mode: electrical
      electrical_case: single_phasing
      faults: []
      load: 1.0
    - id: no_load
      label: "7. 무부하 (저전류)"
      subtitle: "부하가 없으면 자화전류만 흘러 세 상이 모두 파랗다"
      subtitle_en: "With no load only the magnetizing current flows - all three phases go blue"
      source: "해석식 3상 모델"
      source_en: "Analytic 3-phase model"
      duration_s: 20
      time_scale: 60
      mode: electrical
      electrical_case: no_load
      faults: []
      load: 0.0
    - id: itsc_8turn
      label: "8. 턴간 단락 8턴 (확실 탐지 시작)"
      subtitle: "8턴(4.2 %) — 고유 비대칭 위상과 무관하게 I₂/I₁ 최소값이 위험 경계 0.10 을 넘는다"
      subtitle_en: "8 turns (4.2 %) - I2/I1 exceeds the 0.10 danger line regardless of inherent phase"
      source: "등가회로 LUT (격자점 4.17 %)"
      source_en: "Equivalent-circuit LUT (grid point 4.17 %)"
      duration_s: 20
      time_scale: 60
      mode: electrical
      electrical_case: itsc_8turn
      faults: []
      load: 1.0
      highlight: true
    - id: itsc_16turn
      label: "9. 턴간 단락 16턴 (코일 전체)"
      subtitle: "코일 1개(16턴, 8.3 %) 전체 단락 — 루프 전류 81 A, 손실 1.5 kW"
      subtitle_en: "One whole coil (16 turns, 8.3 %) shorted - loop current 81 A, 1.5 kW"
      source: "등가회로 LUT (격자점 8.33 %)"
      source_en: "Equivalent-circuit LUT (grid point 8.33 %)"
      duration_s: 20
      time_scale: 60
      mode: electrical
      electrical_case: itsc_16turn
      faults: []
      load: 1.0
      highlight: true
    - id: itsc_4turn_resistive
      label: "10. 저항성 단락 (4턴, R_f 1.0 Ω)"
      subtitle: "절연 열화 초기 — 루프 전류 4 A 뿐이라 전류 지표로는 거의 보이지 않는다 (온도·진동 지표 필요)"
      subtitle_en: "Early insulation degradation - only 4 A loop current, nearly invisible in current indices"
      source: "등가회로 LUT (R_f 1.0 Ω)"
      source_en: "Equivalent-circuit LUT (R_f 1.0 ohm)"
      duration_s: 20
      time_scale: 60
      mode: electrical
      electrical_case: itsc_4turn_resistive
      faults: []
      load: 1.0
    - id: itsc_4turn_halfload
      label: "11. 반부하 단락 (4턴, 50 %)"
      subtitle: "같은 4턴이라도 부하가 절반이면 I₂/I₁ 은 커진다 — I₂/I_n 은 부하 무관"
      subtitle_en: "Same 4 turns at half load - I2/I1 grows while I2/In stays put"
      source: "등가회로 LUT (부하 50 %)"
      source_en: "Equivalent-circuit LUT (load 50 %)"
      duration_s: 20
      time_scale: 60
      mode: electrical
      electrical_case: itsc_4turn_halfload
      faults: []
      load: 0.5

  manual_defaults:
    mode: electrical
    load: 1.0
    time_scale: 60
    slowmo_factor: 0.016667
    electrical_case: healthy
    faults: []

# 기계 7 장면 (파트 C S2, 2026-10-21): 장면·배속·결함은 scenario_mechanical.yaml(22 kW 공용)과 같고, 자막만 M1 값(베어링 6206ZZC3, ISO 10816-1 Class I 위험 4.5 mm/s).
# 시각 매핑(viz/m1_model.py + assets/motors/M1/prim_map_M1.yaml): bearing_de/nde → /M1/Bearings/DE·NDE, shaft → /M1/Rotor/Shaft, frame → /M1/Housing/Frame·Foot·TerminalBox·Eyebolt,
#   fan_cover → /M1/Housing/FanCover (frame 노드 온도), endshield_de/nde → /M1/Housing/EndShield_DE(_B35)·NDE. 베어링 경고 이상이면 cutaway variant 로 전환.
mechanical:
  playback:
    total_target_s: 180
    subtitle_font_size: 26
    hud_update_hz: 15
  steps:
    - id: normal
      label: "1. 정상 운전"
      subtitle: "모든 부품이 정상 온도 범위 — 원래 재질 색 그대로 (M1 2.2 kW, 정격 4.73 A)"
      subtitle_en: "All components within normal temperature - original material colors (M1 2.2 kW, rated 4.73 A)"
      source: "집중정수 열회로 9노드 모델 (22 kW 기준 손실비 스케일)"
      source_en: "Lumped thermal network, 9 nodes (loss-ratio scaled from 22 kW reference)"
      duration_s: 25
      time_scale: 60
      mode: mechanical
      electrical_case: healthy
      faults: []
      load: 1.0
    - id: bearing_fault
      label: "2. DE 베어링 열화"
      subtitle: "구동측 베어링(6206ZZC3) 마찰 증가 → 온도 상승, 진동 4.8 mm/s (ISO 10816-1 Class I 위험 4.5 초과)"
      subtitle_en: "DE bearing (6206ZZC3) friction rises -> temperature climbs, vibration 4.8 mm/s (above ISO 10816-1 Class I 4.5)"
      source: "베어링 손실 배율 + 전도 저항 악화 모델"
      source_en: "Bearing loss multiplier + degraded conduction model"
      duration_s: 35
      time_scale: 120
      mode: mechanical
      electrical_case: healthy
      faults: [bearing_de_fault]
      load: 1.0
    - id: misalignment
      label: "3. 축 정렬 불량"
      subtitle: "커플링 정렬이 틀어져 양쪽 베어링(DE·NDE 6206) 하중이 늘고 축 온도가 함께 오른다"
      subtitle_en: "Shaft misalignment increases load on both 6206 bearings - the shaft heats up as well"
      source: "부하 배율 + 베어링 손실 증가 모델"
      source_en: "Load multiplier + increased bearing loss"
      duration_s: 25
      time_scale: 120
      mode: mechanical
      electrical_case: healthy
      faults: [misalignment]
      load: 1.0
    - id: fan_failure
      label: "4. 냉각팬 고장"
      subtitle: "외부 방열이 막혀 팬 커버·하우징부터 권선까지 전체 온도가 밀려 올라간다"
      subtitle_en: "Cooling fan failure blocks heat rejection - fan cover, frame and winding all heat up"
      source: "대류 열저항 증가 모델"
      source_en: "Increased convective thermal resistance"
      duration_s: 25
      time_scale: 120
      mode: mechanical
      electrical_case: healthy
      faults: [fan_failure]
      load: 1.0
    - id: brake_drag
      label: "5. 브레이크 끌림"
      subtitle: "제동면이 완전히 떨어지지 않아 마찰열이 축을 타고 들어온다"
      subtitle_en: "Brake fails to fully release - friction heat enters through the shaft"
      source: "축 노드 발열 주입 모델"
      source_en: "Heat injected at the shaft node"
      duration_s: 20
      time_scale: 120
      mode: mechanical
      electrical_case: healthy
      faults: [brake_drag]
      load: 1.0
    - id: overload
      label: "6. 과부하 운전 (열 관점)"
      subtitle: "부하가 정격을 넘으면 동손이 제곱으로 늘어 권선이 가장 먼저 한계(F종)에 닿는다"
      subtitle_en: "Above rated load, copper loss grows with the square of current - the class F winding reaches its limit first"
      source: "부하율 기반 동손 I²R 모델"
      source_en: "Load-based copper loss (I2R) model"
      duration_s: 30
      time_scale: 150
      mode: mechanical
      electrical_case: healthy
      faults: [overload]
      load: 1.0
    - id: cooldown
      label: "7. 결함 해제 후 냉각"
      subtitle: "정비로 결함을 제거하면 온도가 내려간다 — 조기 대응이 가능한 구간"
      subtitle_en: "After maintenance clears the faults, temperatures fall - the window where early action pays off"
      source: "집중정수 열회로 9노드 모델"
      source_en: "Lumped thermal network, 9 nodes"
      duration_s: 20
      time_scale: 150
      mode: mechanical
      electrical_case: healthy
      faults: []
      load: 1.0
      highlight: true
  manual_defaults:
    mode: mechanical
    load: 1.0
    time_scale: 120
    slowmo_factor: 0.016667
    electrical_case: healthy
    faults: []

# 통합 5 장면 (파트 C S2): 장면·배속은 scenario.yaml(22 kW 공용)과 같고, I₂/I₁ 값은 {i2i1} 변수로 그 케이스의 LUT 값을 런타임에 채운다 (정상 0.027, 4턴 0.073, 12턴 0.270).
integrated:
  playback:
    total_target_s: 165
    subtitle_font_size: 26
    hud_update_hz: 15
  steps:
    - id: normal
      label: "1. 정상 운전"
      subtitle: "모든 부품 정상 온도, 3상 전류 균형 — I₂/I₁ 은 고유 비대칭 0.027 뿐"
      subtitle_en: "All components at normal temperature, balanced 3-phase current (I2/I1 = {i2i1}, inherent only)"
      source: "열회로 + 등가회로 LUT (RMxprt v2m2 + MCCM)"
      source_en: "Thermal network + equivalent-circuit LUT (RMxprt v2m2 + MCCM)"
      duration_s: 30
      time_scale: 60
      mode: integrated
      electrical_case: healthy
      faults: []
      load: 1.0
    - id: bearing_fault
      label: "2. DE 베어링 열화 진행"
      subtitle: "구동측 베어링(6206ZZC3) 온도 상승 → 경고 (진동 4.8 mm/s, ISO 10816-1 Class I 위험 4.5 초과)"
      subtitle_en: "DE bearing (6206ZZC3) temperature rising -> WARNING (vibration 4.8 mm/s, above ISO 10816-1 Class I 4.5)"
      source: "베어링 손실 배율 + 전도 저항 악화 모델"
      source_en: "Bearing loss multiplier + degraded conduction model"
      duration_s: 40
      time_scale: 120
      mode: integrated
      electrical_case: healthy
      faults: [bearing_de_fault]
      load: 1.0
    - id: itsc_4turn
      label: "3. 턴간 단락 초기 (4턴)"
      subtitle: "Coil_01 의 4턴(2.1 %) 단락 — I₂/I₁ 0.027 → 0.073, 조기 감지 가능 구간 (경계 0.05)"
      subtitle_en: "4 turns (2.1 %) of Coil_01 shorted - I2/I1 rises to {i2i1} : early detection window (limit 0.05)"
      source: "등가회로 LUT + 2D 와전류 정합 (I_f ±5 %)"
      source_en: "Equivalent-circuit LUT + 2D eddy-current match (I_f within 5 %)"
      duration_s: 35
      time_scale: 120
      mode: integrated
      electrical_case: itsc_4turn
      faults: [bearing_de_fault]
      load: 1.0
      highlight: true
    - id: itsc_12turn
      label: "4. 턴간 단락 진행 (12턴)"
      subtitle: "I₂/I₁ 0.270 — 단락 루프 손실이 권선 노드로 들어가 권선 과열"
      subtitle_en: "I2/I1 = {i2i1} : short-loop loss feeds the winding node -> stator winding overheating"
      source: "등가회로 LUT + 루프 손실 → 열회로 연동"
      source_en: "Equivalent-circuit LUT + loop loss coupled to the thermal network"
      duration_s: 45
      time_scale: 180
      mode: integrated
      electrical_case: itsc_12turn
      faults: [bearing_de_fault]
      load: 1.0
      highlight: true
    - id: conclusion
      label: "5. 결론"
      subtitle: "VIGENT는 이 시점 이전에 경보를 보냅니다 — 조기 감지로 정지 손실을 막습니다"
      subtitle_en: "VIGENT raises the alarm before this point - early detection prevents downtime"
      source: "판정 엔진 (engine/thresholds.py)"
      source_en: "Judgment engine (engine/thresholds.py)"
      duration_s: 15
      time_scale: 60
      mode: integrated
      electrical_case: itsc_12turn
      faults: [bearing_de_fault]
      load: 1.0
      highlight: true
  manual_defaults:
    mode: integrated
    load: 1.0
    time_scale: 60
    slowmo_factor: 0.016667
    electrical_case: healthy
    faults: []
