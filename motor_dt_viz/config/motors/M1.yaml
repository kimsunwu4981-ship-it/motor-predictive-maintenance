#   이전 대표값: 5.0 A / 2.9 A (Δ) / η 0.85 / pf 0.78 (출처 없음). 나머지 키·다른 모터는 그대로.
# 2026-10-21 P1-2: 나머지 카탈로그 항목을 {value, source, doc, note} 래퍼로 추가 (값은 assets/motors/M1/inputs/datasheet_v4.yaml 카탈로그 직접값·MCSA 시트에서만). 기존 5항목 불변.
