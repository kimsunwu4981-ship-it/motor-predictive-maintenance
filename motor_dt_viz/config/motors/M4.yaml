# M4.yaml — 10톤 호이스트 권상 모터 (15.0 kW 6극) · 대표 사양 (명판 아님)
# source: representative — 국내 와이어로프 호이스트 표준 톤수의 권상 전동기를 동급 범용 3상 유도전동기 대표값으로 정리 (TASK_다중모터 §2).
# 정격 전류 = P/(√3·V·η·cosφ) = 30.88 A (η·cosφ 대표값) → 표 값 31.0 A. 상전류 = 선전류/√3 (Δ).
