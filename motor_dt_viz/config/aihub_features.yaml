# aihub_features.yaml — 특징 추출 파라미터 (tools/aihub/extract_features.py). 샘플 주파수에 맞춰 조정 (진동 4 kHz, 전류 2 kHz).
accel_unit: g                   # 설명서 미확인 추정 (docs/aihub_structure.md §2). 확정되면 여기만 바꾼다: g | m/s2 | mm/s(이미 속도)
g_to_m_s2: 9.80665
velocity_band_hz: [10, 1000]    # ISO 10816/20816 속도 RMS 대역 (가속도 → 대역통과 → 주파수 영역 적분)
envelope_band_hz: [500, 1600]   # 포락선 대역통과. 상한은 샘플 주파수의 40 % 로 자동 제한 (지시서 기본 2~8 kHz 는 4 kHz 샘플에서 불가)
envelope_max_fs_fraction: 0.4
harmonic_tolerance: 0.03        # 1×·2×·3× 피크 탐색 폭 (±3 %)
fr_search_hz: [15, 60]          # rpm 이 없을 때 1× 피크 탐색 범위
bands_hz: { lo: [10, 500], mid: [500, 1000], hi: [1000, null] }   # null = 나이퀴스트
clipping_top_fraction: 0.995    # |x| ≥ 0.995·max|x| 인 샘플 비율 → clipping_ratio (사인파 자연 비율 ~6 %보다 크면 의심)
peak_rms_warn: 10               # 품질 경고: crest factor 상한
current_fundamental_hz: 60      # 전류 기본파 (I₂/I₁ 참고 계산)
running_min_load_ratio: 0.10    # 전류 RMS / 정격 < 10 % 면 정지·극저부하로 보고 running=False (기본파·I₂/I₁ 신뢰 불가)
